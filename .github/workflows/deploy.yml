name: Advanced OmniTV Deployer

on:
  schedule:
    - cron: '*/30 * * * *' 
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography requests

      - name: Run OmniTV Channel Syncers (S1 to S8 Order)
        env:
          M3U_OUTPUT_HEADER: ${{ secrets.M3U_OUTPUT_HEADER }}
          OMNI_MASTER_KEY: ${{ secrets.OMNI_MASTER_KEY }}
          OMNI_MASTER_IV: ${{ secrets.OMNI_MASTER_IV }}
          JIO_TV_URL: ${{ secrets.JIO_TV_URL }}
          JIO_TV_PLUS_URL: ${{ secrets.JIO_TV_PLUS_URL }}
          DIGITAL_URL: ${{ secrets.DIGITAL_URL }}
          FANCODE_URL: ${{ secrets.FANCODE_URL }}
          JSTAR_URL: ${{ secrets.JSTAR_URL }}
          SONY_URL: ${{ secrets.SONY_URL }}
          NONY_URL: ${{ secrets.NONY_URL }}
          DIGITAL_TV_URL: ${{ secrets.DIGITAL_TV_URL }}
          ZEE_URL: ${{ secrets.ZEE_URL }}
          SUNNXT_URL: ${{ secrets.SUNNXT_URL }}
        run: |
          python omnitv_jio_S1.py || true
          python omnitv_jioplus_S2.py || true
          python omnitv_telugu_S4.py || true
          python omnitv_sports_Liv_S6.py || true
          python omnitv_jio_star_All_S7.py || true
          python omnitv_Zee__SunNXT_S8.py || true

      - name: Run OmniTV Master Deployer (Encrypt & Package)
        env:
          M3U_OUTPUT_HEADER: ${{ secrets.M3U_OUTPUT_HEADER }}
          OMNI_MASTER_KEY: ${{ secrets.OMNI_MASTER_KEY }}
          OMNI_MASTER_IV: ${{ secrets.OMNI_MASTER_IV }}
        run: |
          python omnitv_main.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare_dist --project-name=omnitv-live
